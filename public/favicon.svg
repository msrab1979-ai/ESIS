<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Kertas peperiksaan -->
  <rect x="14" y="8" width="26" height="34" rx="3" fill="white" opacity="0.95"/>
  <!-- Lipatan sudut -->
  <polygon points="34,8 40,8 40,14" fill="#c7d2fe"/>
  <polygon points="34,8 40,14 34,14" fill="#e0e7ff"/>

  <!-- Garisan soalan -->
  <line x1="19" y1="18" x2="33" y2="18" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="19" y1="23" x2="35" y2="23" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="19" y1="28" x2="31" y2="28" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>

  <!-- Tanda A (gred cemerlang) -->
  <circle cx="46" cy="44" r="13" fill="#16a34a"/>
  <text x="46" y="49" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="15" fill="white">A</text>

  <!-- Pensil kecil -->
  <g transform="translate(11,36) rotate(-45)">
    <rect x="0" y="0" width="4" height="14" rx="1" fill="#fbbf24"/>
    <polygon points="0,14 4,14 2,18" fill="#fca5a5"/>
    <rect x="0" y="0" width="4" height="2.5" rx="1" fill="#9ca3af"/>
  </g>
</svg>

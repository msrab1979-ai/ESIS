<title>Majlis Anugerah — Ibu Bapa</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!--
  ==========================================================================
  ibubapa.html — apps ibu bapa Majlis Anugerah (5 Nov 2026)
  --------------------------------------------------------------------------
  Satu link: ibubapa.html?m=<majlisId>. Wajah ikut JAM (MAJLIS.ibubapa):
    bancian.buka..tutup  → Bancian Kehadiran (KP anak → wakil → hadir)
    daftar.buka..tutup   → Hari Majlis (Daftar ikut no. telefon + Buku Program)

  🔴 TIADA Firebase SDK. Halaman ini dibuka ratusan telefon ibu bapa
     (selalunya data mudah alih), jadi ia bercakap terus dengan Firestore
     REST melalui fetch(): ±0 KB pustaka berbanding ±300 KB SDK. Hanya
     apiKey + projectId disalin dari anugerah-kongsi.js — kalau projek
     bertukar, tukar di sini juga.
  🔴 Setiap carian = SATU doc ikut id (penerima / indeks KP / keluarga),
     dengan mask medan. Jangan sesekali muat senarai murid ke telefon
     ibu bapa — bandwidth dan privasi.
  🔴 Tiada dark mode (peraturan modul Anugerah) — kepala gelap ialah reka
     bentuk, badan sentiasa terang.

  Data:
    anugerah_ibubapa/{majlisId}__{telefon} = { majlisId, telefon,
        wakil:{nama,kp}, murid:[{kp,nama,tahun,kelas}], hadir, dewasa, kanak,
        sumber:'bancian'|'walkin', daftar:null|{bil,masa}, dihantar, dikemaskini }
    anugerah_ibubapa_kp/{majlisId}__{kpAnak} = { majlisId, no_kp, telefon }
      → satu anak satu keluarga: adik-beradik tidak dikira dua kali.
  ==========================================================================
-->
<style>
:root{
  --gelap:#121216; --gelap-2:#24232B;
  --emas:#C6A867; --emas-a:#EAD7A4; --emas-b:#A9874A; --emas-tua:#8C6D33;
  --gading:#FAF7F0; --garis:#E7E0D0; --teks:#1B1B20; --kelabu:#6B6A70;
  --hijau:#2F6B4F; --hijau-bg:#E6F0E9; --merah:#9B2C2C; --merah-bg:#F7E6E6;
  --wa:#1F8F55;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  color-scheme:only light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--gading);color:var(--teks)}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--gading)}

h1,h2,h3{font-family:var(--serif);margin:0;font-weight:600}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--emas);outline-offset:2px}
[hidden]{display:none!important}

.kepala{background:linear-gradient(165deg,var(--gelap),var(--gelap-2));color:var(--gading);padding:28px 22px 22px;text-align:center;position:relative;overflow:hidden}
.kepala::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--emas),transparent)}
.kepala.besar{padding:30px 22px 26px}
.sek{font-size:10.5px;letter-spacing:.24em;color:var(--emas);font-weight:700;text-transform:uppercase}
.kepala h1{font-size:28px;line-height:1.15;margin-top:6px}
.kepala h2{font-size:23px;margin-top:4px}
.kepala em{font-style:italic;background:linear-gradient(90deg,var(--emas-a),var(--emas));-webkit-background-clip:text;background-clip:text;color:transparent}
.kepala .info{font-size:12.5px;color:rgba(250,247,240,.68);margin-top:8px}
.lencana{width:96px;height:82px;margin:0 auto 4px;position:relative}
.lencana .laurel{position:absolute;inset:0;width:96px;height:82px;fill:url(#g-emas);stroke:url(#g-emas)}
.lencana .trofi{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:36px;height:36px}
.kilau{position:absolute;fill:var(--emas);opacity:.55}
.reben{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:9px}
.reben::before,.reben::after{content:"";height:1px;width:38px;background:linear-gradient(90deg,transparent,var(--emas))}
.reben::after{transform:scaleX(-1)}
.reben svg{width:9px;height:9px;fill:var(--emas)}
.k-ikon{width:44px;height:44px;margin:0 auto 7px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(198,168,103,.6);background:rgba(198,168,103,.08)}
.k-ikon svg{width:22px;height:22px;stroke:var(--emas-a)}

.ik{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ik-e{fill:none;stroke:url(#g-emas);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.badan{padding:18px 18px 28px;display:flex;flex-direction:column;gap:14px;flex:1}
.kad{background:#fff;border:1px solid var(--garis);border-radius:14px;padding:15px}
.kad h4{margin:0 0 4px;font-size:14.5px}
.kecil{font-size:13px;color:var(--kelabu);line-height:1.5}
.tengah{text-align:center}
.lab{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.lab svg{width:15px;height:15px;color:var(--emas-tua)}
.wajib{color:var(--merah)}
input.medan{width:100%;border:1px solid var(--garis);border-radius:11px;padding:14px;font:inherit;font-size:17px;letter-spacing:.04em;background:#fff;color:var(--teks)}
input.medan:focus{outline:0;border-color:var(--emas);box-shadow:0 0 0 3px rgba(198,168,103,.22)}
input.medan.teks{letter-spacing:0;text-transform:uppercase}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:12px;padding:15px;font-weight:700;font-size:15px;letter-spacing:.02em;text-decoration:none;text-align:center}
.btn svg{width:19px;height:19px}
.btn.emas{background:linear-gradient(135deg,var(--emas-a),var(--emas) 45%,var(--emas-b));color:var(--gelap);box-shadow:0 4px 14px rgba(169,135,74,.35)}
.btn.gelap{background:var(--gelap);color:var(--gading)}
.btn.garis{border:1px dashed var(--emas-b);color:var(--emas-tua)}
.btn.garis.pejal{border-style:solid}
.btn.wa{background:var(--wa);color:#fff;box-shadow:0 4px 14px rgba(31,143,85,.3)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.pautan{color:var(--emas-tua);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:13.5px}
.ralat{background:var(--merah-bg);color:var(--merah);border-radius:11px;padding:11px 13px;font-size:13.5px;line-height:1.45}

.anak{display:flex;gap:11px;align-items:center;padding:11px 0;border-top:1px solid var(--garis)}
.anak:first-child{border-top:0;padding-top:2px}
.anak:last-child{padding-bottom:2px}
.av{width:38px;height:38px;border-radius:50%;border:1px solid var(--emas);display:grid;place-items:center;flex:0 0 auto;background:#fff;position:relative}

.anak span{font-size:12px;color:var(--kelabu)}
.anak .x{margin-left:auto;color:#B3AB98;font-size:18px;padding:6px 8px}

.pil{display:flex;gap:10px}
.pil button{flex:1;border:1px solid var(--garis);border-radius:11px;padding:13px 6px;font-weight:700;background:#fff}
.pil button.on{border-color:var(--gelap);background:var(--gelap);color:var(--gading)}
.step{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
.step+.step{border-top:1px solid var(--garis)}
.step .lbl{font-size:14px;font-weight:600}
.step .lbl small{display:block;font-weight:400;color:var(--kelabu);font-size:12px}
.ctr{display:flex;align-items:center;gap:14px}
.ctr button{width:38px;height:38px;border-radius:50%;border:1px solid var(--garis);font-size:20px;font-weight:700;background:#fff;line-height:1}
.ctr button.p{background:var(--gelap);border-color:var(--gelap);color:var(--emas-a)}
.ctr button[disabled]{opacity:.3;cursor:not-allowed}
.ctr b{font-size:19px;min-width:20px;text-align:center}

.besar-ok{width:84px;height:84px;border-radius:50%;margin:4px auto 0;display:grid;place-items:center;background:linear-gradient(135deg,var(--emas-a),var(--emas-b));box-shadow:0 0 0 6px var(--gading),0 0 0 7px var(--emas)}
.besar-ok svg{width:44px;height:44px;stroke:var(--gelap)}
.jam-besar{width:58px;height:58px;margin:6px auto 0;display:block}

.majlis{background:#fff;border:1px solid var(--garis);border-radius:14px;padding:4px 15px;position:relative}
.majlis::before{content:"";position:absolute;left:15px;right:15px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--emas),transparent)}
.majlis .tjk{font-size:10.5px;letter-spacing:.2em;font-weight:700;color:var(--emas-tua);text-align:center;padding:11px 0 3px}
.bm{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--garis);text-align:left}
.majlis .tjk+.bm,.majlis>.bm:first-child{border-top:0}
.bm .bi{width:34px;height:34px;border-radius:9px;background:var(--gelap);display:grid;place-items:center;flex:0 0 auto}
.bm .bi svg{width:18px;height:18px}
.bm small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--kelabu);font-weight:700}
.bm b{font-size:14px;line-height:1.3}
.kaki{font-size:12.5px;color:var(--emas-tua);text-align:center;font-style:italic;padding:2px 0 11px}

.menu{display:flex;flex-direction:column;gap:11px}
.menu a,.menu button{background:#fff;border:1px solid var(--garis);border-radius:15px;padding:15px;display:flex;gap:14px;align-items:center;text-align:left;text-decoration:none;color:inherit;width:100%}
.menu .mi{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:var(--gelap);flex:0 0 auto}
.menu .mi svg{width:26px;height:26px}
.menu b{display:block;font-family:var(--serif);font-size:20px;font-weight:600}
.menu span{font-size:12.5px;color:var(--kelabu)}
.menu .pn{margin-left:auto;width:20px;height:20px;color:var(--emas-tua);flex:0 0 auto}
.wa-kad{border:1px solid #CFE5D8;background:#F3FAF6;border-radius:14px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:10px}
.garis-emas{height:1px;background:linear-gradient(90deg,transparent,var(--emas),transparent);margin:2px 10px}
.memuat{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 0;color:var(--kelabu);font-size:14px}
.pusing{width:30px;height:30px;border-radius:50%;border:3px solid var(--garis);border-top-color:var(--emas);animation:p 0.8s linear infinite}
@keyframes p{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.kaki-hal{text-align:center;font-size:11px;color:#A8A294;padding:0 0 18px;letter-spacing:.06em}
</style>
</head>

'use strict';
/* ---------- Firestore REST ---------- */
const IB_KEY = 'AIzaSyA4izu2nFOByzV9YKVFHoL8Q2Q6aTnrIww';
const IB_DOC = 'projects/sistem-esis/databases/(default)/documents';
const IB_URL = 'https://firestore.googleapis.com/v1/' + IB_DOC;

function enc(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (v instanceof Date) return { timestampValue: v.toISOString() };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(enc) } };
  if (typeof v === 'object') return { mapValue: { fields: encF(v) } };
  return { stringValue: String(v) };
}
function encF(o) { const f = {}; for (const k in o) if (o[k] !== undefined) f[k] = enc(o[k]); return f; }
function dec(v) {
  if (!v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('timestampValue' in v) return new Date(v.timestampValue);
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(dec);
  if ('mapValue' in v) return decF(v.mapValue.fields || {});
  return null;
}
function decF(f) { const o = {}; for (const k in f) o[k] = dec(f[k]); return o; }

/* Ralat kuota mesti kedengaran sebagai ralat — bukan "tiada dalam senarai"
   (sama pengajaran dengan _adalahRalatKuota dalam index.html). */
function ralatRest(st, j) {
  const kod = (j && j.error && j.error.status) || '';
  if (st === 429 || kod === 'RESOURCE_EXHAUSTED')
    return new Error('Sistem sekolah sedang sibuk (had harian dicapai). Maklumat anda BELUM disimpan — sila cuba sebentar lagi.');
  if (st === 403 || kod === 'PERMISSION_DENIED') return new Error('Akses ditolak oleh pelayan.');
  return new Error('Gagal menghubungi pelayan' + (st ? ' (' + st + ')' : '') + '. Semak sambungan internet dan cuba lagi.');
}
async function baca(laluan, medan) {
  const q = (medan || []).map(m => '&mask.fieldPaths=' + encodeURIComponent(m)).join('');
  let r;
  try { r = await fetch(IB_URL + '/' + laluan + '?key=' + IB_KEY + q); }
  catch (e) { throw ralatRest(0); }
  if (r.status === 404) return null;
  const j = await r.json().catch(() => null);
  if (!r.ok) throw ralatRest(r.status, j);
  return decF(j.fields || {});
}
/* Satu commit = atomik: keluarga + indeks anak berjaya bersama atau gagal bersama. */
async function commit(writes) {
  let r;
  try {

const ik = (n, k) => '<svg class="' + (k || 'ik') + '"><use href="#i-' + n + '"/></svg>';
const digit = s => String(s || '').replace(/\D/g, '');

const telSah = t => /^0\d{8,10}$/.test(t);

function telSorok(t) { return t.length < 7 ? t : t.slice(0, 3) + '-***' + t.slice(-4); }
function telPapar(t) { return t.length < 7 ? t : t.slice(0, 3) + '-' + t.slice(3, t.length - 4) + ' ' + t.slice(-4); }
/* Nama separa disorok: perkataan pertama penuh, nama bapa = huruf awal. */
function sorok(nama) {
  const w = String(nama || '').trim().toUpperCase().split(/\s+/);
  const kekal = /^(BIN|BINTI|BT|BTE|B|A\/L|A\/P|AL|AP|@)$/;
  let lepasBin = false;
  return w.map((x, i) => {
    if (i === 0 || kekal.test(x)) { lepasBin = kekal.test(x) && i > 0; return x; }
    const r = lepasBin ? x.slice(0, 1) + '****' : (x.length <= 3 ? x : x.slice(0, Math.min(4, x.length - 1)) + '***');
    lepasBin = false;
    return r;

}
const DARJAH = { SATU: 1, DUA: 2, TIGA: 3, EMPAT: 4, LIMA: 5, ENAM: 6 };
function kelasPapar(tahun, kelas) {

  return new RegExp('^' + d + '\\b').test(k) ? k : d + ' ' + k;
}
const HARI = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];

  const w = h < 12 ? 'pagi' : h < 14 ? 'tengah hari' : h < 19 ? 'petang' : 'malam';

}

async function cariAnak() {
  const kp = digit($('kp').value);
  S.ralat = '';
  if (!kpAnakSah(kp)) { S.ralat = 'No. KP mesti 12 digit.'; return vKP(); }
  if (S.anak.some(a => a.kp === kp)) { S.ralat = 'Anak ini sudah ada dalam senarai anda.'; return vKP(); }
  const btn = $('b-cari'); sibuk(btn, true, 'Mencari…');
  try {
    /* Walk-in hari majlis melalui KP: anak sudah ada keluarga → terus ke
       keluarga itu. Tiada → aliran bancian (wakil + bilangan) yang terus mendaftar. */
    if (S.mod === 'walkin' && !S.anak.length) {
      const i0 = await baca(pIdx(kp), ['telefon']);
      const k0 = i0 && i0.telefon ? await baca(pKel(i0.telefon), MEDAN_KEL) : null;
      if (k0) { muatKeluarga(k0); return vDaftarKel(); }
    }
    let [p, idx] = await Promise.all([baca(pPen(kp), ['nama', 'tahun', 'kelas', 'jenis']), baca(pIdx(kp), ['telefon'])]);
    if (!p) { p = await baca(pUji(kp), ['nama', 'tahun', 'kelas']); if (p) p.ujian = true; }
    if (!p || p.jenis === 'luar') { S.ralat = 'No. KP ini tiada dalam senarai penerima anugerah majlis ini. Sila semak semula.'; return vKP(); }
    const telKini = [S.asal && S.asal.telefon, S.sasar && S.sasar.telefon].filter(Boolean);
    if (idx && idx.telefon && !telKini.includes(idx.telefon)) {
      /* Indeks lapuk (keluarga sudah dipadam) → anak bebas. */
      const ada = await baca(pKel(idx.telefon), ['telefon']);
      if (ada) { S.konflik = { kp, tel: idx.telefon }; return vKP(); }
    }
    S.anak.push(Object.assign({ kp, nama: String(p.nama || '').toUpperCase(), tahun: p.tahun || '', kelas: p.kelas || '' }, p.ujian ? { ujian: true } : {}));
    vAnak();
  } catch (e) { S.ralat = e.message; vKP(); }
}
async function sahKonflik() {
  const tel = normTel($('kt').value);
  if (tel !== S.konflik.tel) { S.ralat = 'No. telefon tidak sepadan dengan bancian anak ini.'; return vKP(); }
  const btn = $('b-sah'); sibuk(btn, true);
  try {
    const k = await baca(pKel(tel), MEDAN_KEL);
    if (!k) { S.konflik = null; S.ralat = 'Bancian itu tidak dijumpai. Cuba lagi.'; return vKP(); }
    const lain = S.anak.filter(a => !(k.murid || []).some(m => m.kp === a.kp));
    const asalLama = S.asal;
    muatKeluarga(k);
    /* Anak yang sudah ditaip tadi digabung masuk, tidak hilang. Keluarga
       lama (jika ada) dipadam semasa simpan — anaknya kini di sini. */
    S.anak = S.anak.concat(lain);
    if (asalLama && asalLama.telefon !== k.telefon) S.lama = asalLama;
    S.konflik = null; S.ralat = '';
    vAnak();
  } catch (e) { S.ralat = e.message; vKP(); }
}

    '<div><div class="lab">' + ik('orang') + 'Nama wakil <span class="wajib">*</span></div>' +
    '<input class="medan teks" id="w-nama" autocomplete="name" maxlength="80" value="' + esc(S.wakil.nama) + '"></div>' +
    '<div><div class="lab">' + ik('kad') + 'No. KP wakil <span class="wajib">*</span></div>' +
    '<input class="medan" id="w-kp" inputmode="numeric" maxlength="14" placeholder="12 digit" value="' + esc(S.wakil.kp) + '"></div>' +
    '<div><div class="lab">' + ik('tel') + 'No. telefon <span class="wajib">*</span></div>' +
    '<input class="medan" id="w-tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="Contoh: 0123456789" value="' + esc(S.wakil.tel) + '">' +
    '<div class="kecil" style="margin-top:5px">Untuk daftar kehadiran pada hari majlis.</div></div>' +
    ralatHTML() + '<div style="flex:1"></div>' +
    '<div style="display:flex;gap:8px"><button class="btn garis pejal" id="b-balik" style="flex:1">' + ik('kiri') + '</button>' +
    '<button class="btn emas" id="b-seterus" style="flex:4">Seterusnya' + ik('kanan') + '</button></div></div>');
  const semak = () => {
    const n = $('w-nama').value.trim(), k = digit($('w-kp').value), t = normTel($('w-tel').value);
    $('b-seterus').disabled = !(n.length >= 3 && kpSah(k) && telSah(t));
  };
  ['w-nama', 'w-kp', 'w-tel'].forEach(id => $(id).addEventListener('input', semak));
  semak();
  $('b-balik').onclick = () => { S.ralat = ''; vAnak(); };
  $('b-seterus').onclick = simpanWakil;
}
async function simpanWakil() {
  const nama = $('w-nama').value.trim().toUpperCase().replace(/\s+/g, ' ');
  const kp = digit($('w-kp').value), tel = normTel($('w-tel').value);
  S.ralat = '';
  if (nama.length < 3) S.ralat = 'Sila isi nama wakil.';
  else if (!kpSah(kp)) S.ralat = 'No. KP wakil mesti 12 digit.';
  else if (!telSah(tel)) S.ralat = 'No. telefon tidak sah. Contoh: 0123456789';
  S.wakil = { nama, kp, tel };
  S.gabung = false;
  if (S.ralat) return vWakil();
  /* No. telefon ini sudah ada bancian lain? (cth bapa isi abang semalam,
     ibu isi adik hari ini dengan no. yang sama) → gabung, bukan tindih. */
  const dahTahu = [S.asal, S.sasar].some(k => k && k.telefon === tel);
  if (!dahTahu) {
    const btn = $('b-seterus'); sibuk(btn, true);
    try {
      const k = await baca(pKel(tel), MEDAN_KEL);
      S.sasar = k || null;
      if (k) {
        (k.murid || []).forEach(m => { if (!S.anak.some(a => a.kp === m.kp)) S.anak.push(Object.assign({}, m)); });
        S.hadir = k.hadir !== false; S.dewasa = Math.max(1, k.dewasa || 1); S.kanak = k.kanak || 0;
        S.gabung = true;
      }
    } catch (e) { S.ralat = e.message; return vWakil(); }
  }
  vHadir();
}

/* MAJLIS.ibubapa.had = orang bagi SETIAP anak penerima; had keluarga = had × bilangan anak.
   0/tiada = had lama (10 dewasa/10 kanak, 15 daftar). */
const hadAnak = () => (CFG.had > 0 ? CFG.had : 0);
const hadMaks = () => hadAnak() * Math.max(1, S.anak.length);
const hadNota = () => hadAnak() + ' orang × ' + Math.max(1, S.anak.length) + ' anak penerima';

function vHadir() {
  const walk = S.mod === 'walkin', had = hadMaks();
  /* Bancian lama boleh melebihi had baharu → dipotong (kanak-kanak dahulu). */
  if (had) { S.dewasa = Math.min(S.dewasa, had); S.kanak = Math.min(S.kanak, had - S.dewasa); }
  lukis(kepalaKecil(walk ? 'semak' : 'daftar', walk ? 'PENDAFTARAN' : 'BANCIAN', walk ? 'Bilangan hadir hari ini' : 'Adakah anda akan hadir?') +
    '<div class="badan">' +
    (S.gabung ? '<div class="ok-nota">Bancian sedia ada untuk no. telefon ini dijumpai — anak digabungkan dalam satu keluarga.</div>' : '') +
    (walk ? '' : '<div class="pil"><button id="p-ya" class="' + (S.hadir ? 'on' : '') + '">Hadir</button>' +
      '<button id="p-tidak" class="' + (!S.hadir ? 'on' : '') + '">Tidak hadir</button></div>') +
    (S.hadir ? '<div class="kad" style="padding:6px 15px">' +
      '<div class="step"><div class="lbl">Dewasa<small>Termasuk wakil</small></div><div class="ctr"><button data-k="dewasa" data-d="-1">−</button><b id="n-dewasa">' + S.dewasa + '</b><button class="p" data-k="dewasa" data-d="1">+</button></div></div>' +
      '<div class="step"><div class="lbl">Kanak-kanak<small>Selain penerima anugerah</small></div><div class="ctr"><button data-k="kanak" data-d="-1">−</button><b id="n-kanak">' + S.kanak + '</b><button class="p" data-k="kanak" data-d="1">+</button></div></div>' +
      (had ? '<div class="kecil" style="padding:4px 0 8px">Jumlah <b style="color:var(--teks)" id="n-jum">' + (S.dewasa + S.kanak) + '</b> / <b style="color:var(--teks)">' + had + ' orang</b><br>' + hadNota() + ' (dewasa + kanak-kanak)</div>' : '') +
      '</div>' : '') +
    '<div class="kad" style="padding:11px 15px"><div class="kecil">Wakil: <b style="color:var(--teks)">' + esc(S.wakil.nama) + '</b><br>Anak: ' +
      S.anak.map(a => esc(sorok(a.nama).split(' ').slice(0, 2).join(' '))).join(' · ') + '</div></div>' +
    ralatHTML() + '<div style="flex:1"></div>' +
    '<div style="display:flex;gap:8px"><button class="btn garis pejal" id="b-balik" style="flex:1">' + ik('kiri') + '</button>' +
    '<button class="btn emas" id="b-hantar" style="flex:4">' + ik(walk ? 'semak' : 'daftar') + (walk ? 'Daftar' : 'Hantar bancian') + '</button></div></div>');
  if (!walk) {
    $('p-ya').onclick = () => { S.hadir = true; vHadir(); };
    $('p-tidak').onclick = () => { S.hadir = false; vHadir(); };
  }
  $('app').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k, min = k === 'dewasa' ? 1 : 0;
    const maks = had ? had - (k === 'dewasa' ? S.kanak : S.dewasa) : 10;
    S[k] = Math.min(maks, Math.max(min, S[k] + Number(b.dataset.d)));
    $('n-' + k).textContent = S[k];
    kunciTambah();
  });
  /* Jumlah sudah penuh → butang + dikelabukan. */
  function kunciTambah() {
    if ($('n-jum')) $('n-jum').textContent = S.dewasa + S.kanak;
    $('app').querySelectorAll('[data-k][data-d="1"]').forEach(b => b.disabled = !!had && S.dewasa + S.kanak >= had);
  }
  kunciTambah();
  $('b-balik').onclick = () => { S.ralat = ''; vWakil(); };
  $('b-hantar').onclick = hantar;
}

async function hantar() {
  const btn = $('b-hantar'); sibuk(btn, true, 'Menyimpan…');
  const walk = S.mod === 'walkin', tel = S.wakil.tel;
  const base = S.sasar || (S.asal && S.asal.telefon === tel ? S.asal : null);
  const doc = {
    majlisId: M_ID, telefon: tel,
    wakil: { nama: S.wakil.nama, kp: S.wakil.kp },
    murid: S.anak.map(a => Object.assign({ kp: a.kp, nama: a.nama, tahun: a.tahun, kelas: a.kelas }, a.ujian ? { ujian: true } : {})),
    ujian: S.anak.some(a => a.ujian),
    hadir: walk ? true : S.hadir,
    dewasa: (walk || S.hadir) ? S.dewasa : 0,
    kanak: (walk || S.hadir) ? S.kanak : 0,
    sumber: (base && base.sumber) || (walk ? 'walkin' : 'bancian'),
    daftar: walk ? { bil: S.dewasa + S.kanak, masa: new Date() } : ((base && base.daftar) || null),
    dihantar: (base && masaJadi(base.dihantar)) || new Date(),
    dikemaskini: new Date()
  };
  const akhir = new Set(doc.murid.map(m => m.kp));
  const writes = [wSet(pKel(tel), doc)];
  doc.murid.forEach(m => writes.push(wSet(pIdx(m.kp), { majlisId: M_ID, no_kp: m.kp, telefon: tel })));
  /* Anak yang dibuang dari keluarga ini → indeksnya dilepaskan. */
  const lepas = new Set();
  [S.asal, S.sasar, S.lama].forEach(k => (k && k.murid || []).forEach(m => { if (!akhir.has(m.kp)) lepas.add(m.kp); }));
  lepas.forEach(kp => writes.push(wPadam(pIdx(kp))));
  /* Tukar no. telefon / gabung → doc keluarga lama dipadam (anaknya kini di doc baharu). */
  new Set([S.asal, S.lama].filter(k => k && k.telefon !== tel).map(k => k.telefon))
    .forEach(t => writes.push(wPadam(pKel(t))));
  try {
    await commit(writes);
    localStorage.setItem(SIMPAN, tel);
    S.asal = doc; S.sasar = null; S.lama = null; S.gabung = false;
    walk ? vDaftarSiap() : vSiap();
  } catch (e) { S.ralat = e.message; sibuk(btn, false); vHadir(); }
}

function waKad() {
  const w = CFG.wa || {};
  if (!w.on || !/^https:\/\/chat\.whatsapp\.com\//.test(w.url || '')) return '';
  return '<div class="wa-kad"><div class="kecil">' + esc(w.teks || 'Sertai group WhatsApp ibu bapa untuk makluman terkini majlis.') + '</div>' +
    '<a class="btn wa" href="' + esc(w.url) + '" target="_blank" rel="noopener">' + ik('sembang') + 'Sertai Group WhatsApp</a></div>';
}
function vSiap() {
  const k = S.asal, hadir = k.hadir !== false;
  lukis(kepalaKecil('pingat', 'TERIMA KASIH', 'Bancian diterima') +
    '<div class="badan tengah" data-laman>' +
    '<div class="besar-ok">' + ik('pingat') + '</div>' +
    '<div><b style="font-size:17px">' + (hadir ? 'Hadir · ' + ((k.dewasa || 0) + (k.kanak || 0)) + ' orang' : 'Tidak hadir') + '</b>' +
    '<div class="kecil">Wakil: ' + esc((k.wakil || {}).nama) + '</div></div>' +
    '<div style="text-align:left">' + senaraiAnak(false) + '</div>' +
    waKad() +
    (hadir ? '<div class="kad" style="text-align:left;padding:12px 15px"><div class="kecil"><b style="color:var(--teks)">Pada hari majlis:</b> buka link yang sama → <b>Daftar Kehadiran</b> → masukkan <b>' +
      esc(telPapar(k.telefon)) + '</b>.</div></div>' : '') +
    '<div style="flex:1"></div>' +
    '<button class="btn garis pejal" id="b-ubah">Ubah bancian</button>' +
    '<button class="pautan" id="b-lain" style="align-self:center">Isi untuk keluarga lain</button></div>');
  $('b-ubah').onclick = () => { muatKeluarga(S.asal); vAnak(); };
  $('b-lain').onclick = () => { localStorage.removeItem(SIMPAN); S = baru(); vKP(); };
}

/* ==========================================================================
   HARI MAJLIS — Daftar Kehadiran + Buku Program
   ========================================================================== */
function vUtama() {
  S = baru();
  lukis(kepalaBesar() + '<div class="badan" data-laman>' + kadMajlis(false) +
    '<div class="menu">' +
    '<button id="b-daftar"><div class="mi">' + ik('daftar', 'ik-e') + '</div><div><b>Daftar Kehadiran</b><span>Guna no. telefon bancian</span></div>' + ik('kanan', 'ik pn') + '</button>' +
    (CFG.buku ? '<a href="' + esc(CFG.buku) + '" target="_blank" rel="noopener"><div class="mi">' + ik('buku', 'ik-e') + '</div><div><b>Buku Program</b><span>Buka dalam Google Drive</span></div>' + ik('pautan', 'ik pn') + '</a>' : '') +
    '</div></div>');
  $('b-daftar').onclick = () => vDaftarTel();
}

function vDaftarTel() {
  lukis(kepalaKecil('tel', 'PENDAFTARAN', 'Daftar Kehadiran') +
    '<div class="badan">' + kadMajlis(true) +
    '<div><div class="lab">' + ik('tel') + 'No. telefon (semasa bancian)</div>' +
    '<input class="medan" id="tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="Contoh: 0123456789"></div>' +
    ralatHTML() +
    '<button class="btn emas" id="b-cari">' + ik('cari') + 'Cari</button>' +
    '<div class="garis-emas" style="margin:4px 0"></div>' +
    '<div class="kecil tengah">Tidak isi bancian atau guna telefon lain?<br>' +
    '<button class="pautan" id="b-kp">Cari dengan No. KP anak →</button></div>' +
    '<div style="flex:1"></div><button class="btn garis pejal" id="b-utama">' + ik('kiri') + 'Kembali</button></div>');
  const ingat = localStorage.getItem(SIMPAN);
  if (ingat) $('tel').value = ingat;
  $('tel').addEventListener('keydown', e => { if (e.key === 'Enter') cariTel(); });
  $('b-cari').onclick = cariTel;
  $('b-kp').onclick = () => { S = baru('walkin'); vKP(); };
  $('b-utama').onclick = vUtama;
}
async function cariTel() {
  const tel = normTel($('tel').value);
  S.ralat = '';
  if (!telSah(tel)) { S.ralat = 'No. telefon tidak sah. Contoh: 0123456789'; return vDaftarTel(); }
  const btn = $('b-cari'); sibuk(btn, true, 'Mencari…');
  try {
    const k = await baca(pKel(tel), MEDAN_KEL);
    if (!k) { S.ralat = 'Tiada bancian dengan no. telefon ini. Cuba no. lain, atau cari dengan No. KP anak.'; return vDaftarTel(); }
    muatKeluarga(k);
    vDaftarKel();
  } catch (e) { S.ralat = e.message; vDaftarTel(); }
}

function vDaftarKel() {
  const k = S.asal, d = k.daftar;
  if (d && d.bil) S.bil = d.bil;
  else S.bil = Math.max(1, (k.hadir !== false ? (k.dewasa || 0) + (k.kanak || 0) : 0) || 1);
  const had = hadMaks();
  if (had) S.bil = Math.min(S.bil, had);
  lukis(kepalaKecil('keluarga', 'PENDAFTARAN', 'Keluarga anda') +
    '<div class="badan">' + senaraiAnak(false) +
    (d ? '<div class="ok-nota">Sudah berdaftar pada ' + esc(jam(masaJadi(d.masa))) + ' · ' + d.bil + ' orang. Anda boleh kemas kini bilangan.</div>' : '') +
    '<div class="kad" style="padding:6px 15px"><div class="step"><div class="lbl">Hadir hari ini<small>' +
      (k.hadir !== false ? 'Bancian: ' + ((k.dewasa || 0) + (k.kanak || 0)) + ' orang' : 'Bancian: tidak hadir') + (had ? '<br>Maksimum ' + had + ' orang (' + hadNota() + ')' : '') +
    '</small></div><div class="ctr"><button data-d="-1">−</button><b id="n-bil">' + S.bil + '</b><button class="p" data-d="1">+</button></div></div></div>' +
    '<div class="kecil">Wakil: <b style="color:var(--teks)">' + esc((k.wakil || {}).nama) + '</b></div>' +
    ralatHTML() + '<div style="flex:1"></div>' +
    '<div style="display:flex;gap:8px"><button class="btn garis pejal" id="b-balik" style="flex:1">' + ik('kiri') + '</button>' +
    '<button class="btn emas" id="b-daftar" style="flex:4">' + ik('semak') + (d ? 'Kemas kini' : 'Daftar') + '</button></div></div>');
  $('app').querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    S.bil = Math.min(had || 15, Math.max(1, S.bil + Number(b.dataset.d))); $('n-bil').textContent = S.bil;
    kunciBil();
  });
  const kunciBil = () => { const p = $('app').querySelector('[data-d="1"]'); if (p) p.disabled = S.bil >= (had || 15); };
  kunciBil();
  $('b-balik').onclick = () => { S = baru(); vDaftarTel(); };
  $('b-daftar').onclick = daftar;
}
async function daftar() {
  const btn = $('b-daftar'); sibuk(btn, true, 'Mendaftar…');
  const k = S.asal, d = { bil: S.bil, masa: new Date() };
  try {
    /* updateMask: HANYA daftar + hadir ditulis — wakil/anak/bilangan bancian kekal. */
    await commit([wSet(pKel(k.telefon), { daftar: d, hadir: true }, ['daftar', 'hadir'])]);
    localStorage.setItem(SIMPAN, k.telefon);
    k.daftar = d; k.hadir = true;
    vDaftarSiap();
  } catch (e) { S.ralat = e.message; vDaftarKel(); }
}
function vDaftarSiap() {
  const k = S.asal, d = k.daftar || {};
  lukis(kepalaKecil('semak', 'PENDAFTARAN', 'Selamat datang') +
    '<div class="badan tengah" data-laman>' +
    '<div class="besar-ok">' + ik('pingat') + '</div>' +
    '<div><b style="font-size:18px">Berdaftar · ' + (d.bil || 0) + ' orang</b><div class="kecil">' + esc(jam(masaJadi(d.masa) || new Date())) + '</div></div>' +
    '<div class="kecil">Tahniah atas kecemerlangan<br><b style="color:var(--teks)">' +
      (k.murid || []).map(m => esc(sorok(m.nama).split(' ').slice(0, 2).join(' '))).join(' & ') + '</b></div>' +
    kadMajlis(true) + '<div style="flex:1"></div>' +
    (CFG.buku ? bukuBtn() : '') +
    '<button class="btn garis pejal" id="b-utama">Laman utama</button></div>');
  $('b-utama').onclick = vUtama;
}

mula();
</script>
</body>
</html>
